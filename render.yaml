# One-click deploy: https://render.com/deploy?repo=<your-repo-url>
services:
  - type: web
    name: cartpilot
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: CHAT_LIMIT_PER_HOUR
        value: "40"
      - key: REPO_URL
        sync: false
